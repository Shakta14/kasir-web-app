<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Kasir Sederhana</title>
    <!-- Tailwind CSS CDN untuk styling yang rapi dan cepat -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white w-full max-w-md rounded-xl shadow-lg p-6">
        <h1 class="text-2xl font-bold text-slate-800 mb-6 text-center">Kasir Pribadi 🛒</h1>

        <form id="formKasir" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Nama Barang</label>
                <input type="text" id="nama_barang" required placeholder="Contoh: Kopi Susu" 
                    class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Kategori</label>
                <select id="kategori" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="Minuman">Minuman</option>
                    <option value="Makanan">Makanan</option>
                    <option value="Lainnya">Lainnya</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Harga Satuan (Rp)</label>
                <input type="number" id="harga_satuan" required placeholder="15000" 
                    class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Jumlah Beli</label>
                <input type="number" id="jumlah_beli" required value="1" min="1" 
                    class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Metode Pembayaran</label>
                <select id="metode_bayar" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="Tunai">Tunai</option>
                    <option value="QRIS">QRIS</option>
                    <option value="Transfer">Transfer</option>
                </select>
            </div>

            <button type="submit" id="btnSimpan" 
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition duration-200 shadow-md">
                Simpan Transaksi & Masukkan ke Spreadsheet
            </button>
        </form>

        <div id="statusPesan" class="mt-4 text-center text-sm font-medium"></div>
    </div>

    <script>
        // ⚠️ PASTIKAN URL WEB APP INI SUDAH BENAR DAN TERBARU
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbx9kKXIdq7K7Qw2cLnYct2lgR94gRmaPp_7d4jYMb7bjO3JeM6jnlXenvY2mxsXidoB/exec";

        const form = document.getElementById('formKasir');
        const btnSimpan = document.getElementById('btnSimpan');
        const statusPesan = document.getElementById('statusPesan');

        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            btnSimpan.disabled = true;
            btnSimpan.innerText = "Menyimpan ke Spreadsheet...";
            statusPesan.innerText = "";

            // Menggunakan URLSearchParams agar aman dari blokiran CORS browser
            const formData = new URLSearchParams();
            formData.append('nama_barang', document.getElementById('nama_barang').value);
            formData.append('kategori', document.getElementById('kategori').value);
            formData.append('harga_satuan', document.getElementById('harga_satuan').value);
            formData.append('jumlah_beli', document.getElementById('jumlah_beli').value);
            formData.append('metode_bayar', document.getElementById('metode_bayar').value);

            try {
                const response = await fetch(WEB_APP_URL, {
                    method: "POST",
                    body: formData
                });

                statusPesan.className = "mt-4 text-center text-sm font-medium text-green-600";
                statusPesan.innerText = "✅ Transaksi berhasil disimpan ke Google Spreadsheet!";
                
                form.reset();
                document.getElementById('jumlah_beli').value = "1";

            } catch (error) {
                statusPesan.className = "mt-4 text-center text-sm font-medium text-red-600";
                statusPesan.innerText = "❌ Gagal menyimpan: " + error.message;
            } finally {
                btnSimpan.disabled = false;
                btnSimpan.innerText = "Simpan Transaksi & Masukkan ke Spreadsheet";
            }
        });
    </script>
</body>
</html>
